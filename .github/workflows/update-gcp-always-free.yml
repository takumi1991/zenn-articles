name: Update GCP Always Free Article

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 1 * *"   # 毎月1日 00:05 UTC（JST 09:05）

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  APIFY_ACTOR_ID_GCP: ${{ secrets.APIFY_ACTOR_ID_GCP }}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # 1. Checkout
      # --------------------------
      - name: Checkout
        uses: actions/checkout@v3

      # --------------------------
      # 2. Apify Actor 実行＋データ取得（重要）
      # --------------------------
      - name: Run Apify Actor (GCP sync)
        run: |
          echo "▶ Running Apify Actor (GCP)"

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/acts/${APIFY_ACTOR_ID_GCP}/run-sync-get-dataset-items?token=$APIFY_TOKEN&format=json" \
            -o data.json

          echo "Saved data.json:"
          head -n 20 data.json

      # --------------------------
      # 3. Node.js セットアップ
      # --------------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # --------------------------
      # 4. 依存関係インストール
      # --------------------------
      - name: Install deps
        run: npm install

      # --------------------------
      # 5. GCP 記事更新
      # --------------------------
      - name: Run update-gcp.js
        run: node scripts/update-gcp.js

      # --------------------------
      # 6. Commit & Push
      # --------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add articles/gcp-always-free.md
          git commit -m "Update GCP Always Free article" || echo "No changes"
          git push
